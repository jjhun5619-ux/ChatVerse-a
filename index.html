<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🌌 챗버스a</title> 
    
    <style>
        /* ============================================================
           챗버스a - 전체 스타일
           ============================================================ */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg-primary: #0a0a1a;
            --bg-secondary: rgba(20, 20, 40, 0.6);
            --bg-card: rgba(20, 20, 40, 0.5);
            --bg-input: rgba(255, 255, 255, 0.03);
            --bg-modal: rgba(0, 0, 0, 0.7);
            --text-primary: #f0f0f5;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --text-muted: rgba(255, 255, 255, 0.25);
            --border-color: rgba(255, 255, 255, 0.06);
            --accent-purple: #c084fc;
            --accent-blue: #60a5fa;
            --accent-cyan: #22d3ee;
            --gradient: linear-gradient(135deg, #c084fc, #60a5fa, #22d3ee);
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            --header-bg: rgba(10, 10, 26, 0.9);
            --nav-bg: rgba(10, 10, 26, 0.9);
            --chat-bg: #0a0a1a;
            --msg-ai-bg: rgba(20, 20, 40, 0.6);
            --msg-sys-bg: rgba(255, 255, 255, 0.02);
        }
        
        body {
            font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite alternate;
        }
        @keyframes twinkle { 0% { opacity: 0.2; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1.2); } }
        .aurora {
            position: fixed;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(ellipse at 20% 50%, rgba(192,132,252,0.06) 0%, transparent 50%),
                        radial-gradient(ellipse at 80% 50%, rgba(96,165,250,0.06) 0%, transparent 50%),
                        radial-gradient(ellipse at 50% 80%, rgba(34,211,238,0.04) 0%, transparent 50%);
            animation: auroraMove 20s ease-in-out infinite alternate;
            pointer-events: none; z-index: 0;
        }
        @keyframes auroraMove { 0% { transform: rotate(0deg) scale(1); } 50% { transform: rotate(5deg) scale(1.05); } 100% { transform: rotate(-5deg) scale(0.95); } }
        
        /* ===== 로그인 ===== */
        .login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.92); backdrop-filter: blur(20px);
            z-index: 9999; display: flex; justify-content: center; align-items: center;
            transition: .5s; flex-direction: column;
        }
        .login-overlay.hidden { opacity: 0; pointer-events: none; }
        .login-box {
            background: rgba(20,20,40,0.8); border: 1px solid var(--border-color);
            border-radius: 28px; padding: 40px 36px 32px; max-width: 420px; width: 90%;
            text-align: center;
        }
        .login-box .icon { font-size: 48px; display: block; margin-bottom: 4px; }
        .login-box h1 {
            font-size: 28px; font-weight: 800;
            background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }
        .login-box .sub { font-size: 10px; color: var(--text-muted); letter-spacing: 4px; margin-bottom: 16px; }
        .login-box input {
            width: 100%; padding: 14px 18px; margin-bottom: 10px; border-radius: 14px;
            border: 1px solid var(--border-color); background: var(--bg-input);
            color: var(--text-primary); font-size: 15px; outline: none; transition: 0.3s;
        }
        .login-box input:focus { border-color: rgba(192,132,252,0.2); background: rgba(255,255,255,0.05); }
        .login-box .btn-login {
            width: 100%; padding: 14px; border-radius: 14px; border: none;
            background: var(--gradient); color: #fff; font-size: 16px; font-weight: 700;
            cursor: pointer; transition: 0.3s;
        }
        .login-box .btn-login:hover { transform: scale(1.02); box-shadow: 0 4px 30px rgba(192,132,252,0.25); }
        .login-box .btn-guest {
            width: 100%; padding: 10px; margin-top: 8px; border-radius: 14px;
            border: 1px solid var(--border-color); background: transparent;
            color: var(--text-secondary); font-size: 13px; font-weight: 600; cursor: pointer;
        }
        .login-box .btn-guest:hover { background: rgba(255,255,255,0.03); }
        .divider {
            display: flex; align-items: center; gap: 14px; margin: 18px 0 12px;
            color: var(--text-muted); font-size: 10px;
        }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border-color); }
        .social-buttons { display: flex; gap: 8px; }
        .social-buttons button {
            flex: 1; padding: 8px; border-radius: 12px; border: 1px solid var(--border-color);
            background: rgba(255,255,255,0.02); cursor: pointer; transition: 0.3s;
            display: flex; flex-direction: column; align-items: center; gap: 2px;
        }
        .social-buttons button:hover { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.15); transform: translateY(-2px); }
        .social-buttons button .sicon { height: 24px; width: auto; display: block; object-fit: contain; }
        .social-buttons button .sname { font-size: 8px; color: var(--text-muted); font-weight: 600; }
        .login-box .policy { font-size: 9px; color: var(--text-muted); margin-top: 12px; line-height: 1.6; }
        .login-box .policy a { color: var(--accent-purple); text-decoration: none; }
        .login-box .error { font-size: 12px; color: #f87171; margin-top: 8px; min-height: 20px; }
        
        /* ===== 헤더 ===== */
        header {
            background: var(--header-bg); backdrop-filter: blur(10px);
            padding: 10px 16px; border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; z-index: 2; position: relative;
        }
        header .logo-area { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        header .logo-area .icon { font-size: 28px; }
        header .logo-area h1 {
            font-size: 18px; font-weight: 800;
            background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }
        header .logo-area .sub { font-size: 8px; color: var(--text-muted); letter-spacing: 2px; }
        .header-right { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .badge {
            font-size: 8px; padding: 2px 10px; border-radius: 12px; font-weight: 600;
            background: rgba(192,132,252,0.12); color: var(--accent-purple);
        }
        .badge-gold { background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #1a1a2e; }
        .badge-premium { background: linear-gradient(135deg, #c084fc, #60a5fa); color: #fff; }
        .badge-save { background: rgba(34,211,238,0.12); color: var(--accent-cyan); }
        .badge-guest { background: rgba(251,191,36,0.12); color: #fbbf24; }
        .badge-legend { background: linear-gradient(135deg, #fbbf24, #c084fc, #22d3ee); color: #fff; animation: legend-glow 3s infinite; }
        @keyframes legend-glow { 0%,100% { box-shadow: 0 0 10px rgba(251,191,36,0.2); } 50% { box-shadow: 0 0 35px rgba(244,63,94,0.4); } }
        .theme-toggle { background: none; border: none; color: var(--text-secondary); font-size: 18px; cursor: pointer; padding: 4px 8px; border-radius: 8px; }
        .theme-toggle:hover { background: rgba(255,255,255,0.03); }
        
        /* ===== 메인 ===== */
        .main { flex: 1; overflow-y: auto; padding: 12px; padding-bottom: 80px; position: relative; z-index: 1; }
        .page { display: none; animation: fadeIn 0.25s ease; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .card {
            background: var(--bg-card); backdrop-filter: blur(10px);
            border: 1px solid var(--border-color); border-radius: 16px; padding: 16px; margin-bottom: 12px;
        }
        .card h3 { color: var(--accent-purple); font-size: 14px; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
        .card h3 .icon { font-size: 18px; }
        input, textarea, select {
            width: 100%; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--border-color);
            background: var(--bg-input); color: var(--text-primary); font-size: 13px; outline: none; margin-bottom: 6px;
            font-family: inherit; transition: 0.3s;
        }
        input:focus, textarea:focus, select:focus { border-color: rgba(192,132,252,0.2); background: rgba(255,255,255,0.05); }
        button { padding: 6px 14px; border-radius: 10px; border: none; font-weight: 600; font-size: 12px; cursor: pointer; transition: all 0.3s ease; }
        button:active { transform: scale(0.95); }
        .btn-p { background: var(--gradient); color: #fff; }
        .btn-p:hover { transform: scale(1.02); box-shadow: 0 4px 20px rgba(192,132,252,0.2); }
        .btn-g { background: rgba(34,211,238,0.12); color: var(--accent-cyan); }
        .btn-g:hover { background: rgba(34,211,238,0.2); }
        .btn-d { background: rgba(239,68,68,0.12); color: #f87171; }
        .btn-d:hover { background: rgba(239,68,68,0.2); }
        .btn-creator { background: linear-gradient(135deg, #c084fc, #22d3ee); color: #fff; }
        .btn-creator:hover { transform: scale(1.02); box-shadow: 0 4px 20px rgba(192,132,252,0.2); }
        .btn-full { width: 100%; padding: 10px; margin-top: 6px; border-radius: 12px; background: var(--gradient); color: #fff; font-size: 13px; display: flex; justify-content: center; align-items: center; gap: 6px; }
        .btn-sm { padding: 4px 12px; font-size: 11px; }
        .btn-premium-glow { background: var(--gradient); color: #fff; animation: premium-pulse 2s infinite; }
        @keyframes premium-pulse { 0%,100% { box-shadow: 0 0 10px rgba(192,132,252,0.15); } 50% { box-shadow: 0 0 25px rgba(192,132,252,0.3); } }
        
        .token-display {
            display: flex; align-items: center; gap: 12px; padding: 8px 14px;
            background: rgba(251,191,36,0.03); border: 1px solid rgba(251,191,36,0.06);
            border-radius: 12px; margin-bottom: 12px; flex-wrap: wrap;
        }
        .token-item { display: flex; align-items: center; gap: 4px; font-size: 13px; }
        .token-item .icon { font-size: 16px; }
        .token-item .value { font-weight: 700; }
        .token-item .value.gold { color: #fbbf24; }
        .token-item .value.premium { color: var(--accent-blue); }
        .token-item .label { font-size: 10px; color: var(--text-muted); }
        
        /* ===== 하단 네비 ===== */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: var(--nav-bg); backdrop-filter: blur(10px);
            border-top: 1px solid var(--border-color);
            display: flex; justify-content: space-around; padding: 8px 0 12px 0; z-index: 100;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 2px;
            color: var(--text-muted); font-size: 8px; cursor: pointer; transition: .2s;
            padding: 4px 12px; border: none; background: none; font-family: inherit;
        }
        .nav-item .icon { font-size: 20px; }
        .nav-item.active { color: var(--accent-purple); }
        .nav-item .create-btn {
            background: var(--gradient); color: #fff; width: 48px; height: 48px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 28px; font-weight: 300; margin-top: -20px;
            box-shadow: 0 4px 20px rgba(192,132,252,0.3);
        }
        
        /* ===== 세계관 ===== */
        .world-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .world-card {
            background: rgba(255,255,255,0.02); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 12px; text-align: center; cursor: pointer; transition: all 0.2s ease; position: relative;
        }
        .world-card:hover { background: rgba(255,255,255,0.04); border-color: rgba(192,132,252,0.1); transform: translateY(-2px); }
        .world-card .icon { font-size: 24px; display: block; margin-bottom: 2px; }
        .world-card .name { font-size: 13px; font-weight: 700; color: var(--accent-purple); }
        .world-card .desc { font-size: 10px; color: var(--text-secondary); }
        .world-card .count { font-size: 10px; color: var(--text-muted); margin-top: 2px; }
        .world-card .del {
            position: absolute; top: 4px; right: 4px;
            background: rgba(239,68,68,0.08); color: #f87171; border: none;
            border-radius: 50%; width: 20px; height: 20px; font-size: 11px; cursor: pointer;
        }
        .world-card .del:hover { background: rgba(239,68,68,0.2); }
        
        /* ===== 캐릭터 ===== */
        .char-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .char-card {
            background: rgba(255,255,255,0.02); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 12px; text-align: center; cursor: pointer; transition: all 0.2s ease; position: relative;
        }
        .char-card:hover { background: rgba(255,255,255,0.04); border-color: rgba(192,132,252,0.1); }
        .char-card .avatar { font-size: 28px; display: block; }
        .char-card .name { font-size: 13px; font-weight: 700; color: var(--accent-purple); }
        .char-card .desc { font-size: 10px; color: var(--text-secondary); }
        .char-card .lv { font-size: 10px; color: #fbbf24; }
        .char-card .mood { font-size: 11px; margin-top: 2px; }
        
        /* ===== 발견 ===== */
        .discover-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .discover-card {
            background: rgba(255,255,255,0.02); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 12px; text-align: center; cursor: pointer; transition: all 0.2s ease;
        }
        .discover-card:hover { background: rgba(255,255,255,0.04); border-color: rgba(192,132,252,0.1); transform: translateY(-2px); }
        .discover-card .avatar { font-size: 28px; display: block; }
        .discover-card .name { font-size: 13px; font-weight: 700; color: var(--accent-purple); }
        .discover-card .creator { font-size: 9px; color: var(--text-muted); margin-top: 2px; }
        .discover-card .stats { font-size: 10px; color: var(--text-secondary); margin-top: 4px; display: flex; justify-content: center; gap: 12px; }
        
        /* ===== 배지 ===== */
        .badge-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
        .badge-item {
            background: rgba(255,255,255,0.02); border: 1px solid var(--border-color);
            border-radius: 8px; padding: 8px; text-align: center; transition: all 0.3s ease;
        }
        .badge-item.obtained { border-color: rgba(192,132,252,0.15); background: rgba(192,132,252,0.04); }
        .badge-item.locked { opacity: 0.4; }
        .badge-item .emoji { font-size: 24px; display: block; }
        .badge-item .name { font-size: 9px; color: var(--text-primary); margin-top: 2px; }
        .badge-item .rarity { font-size: 7px; }
        .badge-item .rarity.common { color: #34d399; }
        .badge-item .rarity.rare { color: #3b82f6; }
        .badge-item .rarity.heroic { color: #8b5cf6; }
        .badge-item .rarity.legendary { color: #fbbf24; }
        .badge-item .rarity.mythic { color: #f43f5e; }
        
        /* ===== 도서관 ===== */
        .knowledge-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .knowledge-card {
            background: rgba(255,255,255,0.02); border: 1px solid var(--border-color);
            border-radius: 8px; padding: 10px; cursor: pointer; transition: all 0.2s ease;
        }
        .knowledge-card:hover { background: rgba(255,255,255,0.04); border-color: rgba(192,132,252,0.1); }
        .knowledge-card .title { font-size: 13px; font-weight: 700; color: var(--accent-purple); }
        .knowledge-card .content { font-size: 11px; color: var(--text-secondary); margin-top: 4px; }
        .knowledge-card .source { font-size: 9px; color: var(--text-muted); margin-top: 2px; }
        
        /* ===== 채팅 ===== */
        #chatPanel {
            display: none; flex-direction: column; flex: 1; overflow: hidden;
            position: fixed; top: 60px; left: 0; right: 0; bottom: 80px;
            background: var(--chat-bg); z-index: 50;
        }
        #chatPanel.active { display: flex; }
        .chat-h {
            padding: 8px 12px; background: var(--bg-secondary); border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: space-between; flex-wrap: wrap; font-size: 11px;
            color: var(--text-secondary); flex-shrink: 0; gap: 4px;
        }
        .chat-left { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .chat-left .close-btn { background: none; border: none; color: var(--text-secondary); font-size: 20px; cursor: pointer; padding: 0 4px; }
        .chat-left .close-btn:hover { color: #f87171; }
        .mode-upgrade-btn {
            background: rgba(192,132,252,0.08); border: 1px solid rgba(192,132,252,0.1);
            border-radius: 20px; padding: 2px 10px; font-size: 10px; color: var(--accent-purple);
            cursor: pointer; transition: all 0.3s ease; display: inline-flex; align-items: center; gap: 4px;
        }
        .mode-upgrade-btn:hover { background: rgba(192,132,252,0.15); transform: scale(1.02); }
        .mode-selector { display: flex; gap: 4px; flex-wrap: wrap; }
        .mode-selector button {
            font-size: 8px; padding: 2px 10px; border-radius: 10px;
            background: rgba(255,255,255,0.02); color: var(--text-secondary);
            border: 1px solid transparent; cursor: pointer; transition: .2s;
        }
        .mode-selector button:hover { background: rgba(192,132,252,0.06); color: var(--accent-purple); }
        .mode-selector button.active { background: rgba(192,132,252,0.1); color: var(--accent-purple); border-color: rgba(192,132,252,0.12); }
        .chat-area { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 4px; }
        .msg {
            max-width: 92%; padding: 10px 16px; border-radius: 14px; font-size: 14px; line-height: 1.8;
            animation: slideIn 0.3s ease; word-break: break-word; box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .msg.user { align-self: flex-end; background: var(--gradient); border-bottom-right-radius: 4px; color: #fff; }
        .msg.ai { align-self: flex-start; background: var(--msg-ai-bg); border: 1px solid var(--border-color); border-left: 3px solid var(--accent-purple); border-bottom-left-radius: 4px; }
        .msg.ai .n { color: var(--accent-purple); font-weight: 700; font-size: 12px; display: flex; align-items: center; gap: 6px; margin-bottom: 4px; flex-wrap: wrap; }
        .msg.ai .n .tag { font-size: 7px; padding: 2px 10px; border-radius: 12px; font-weight: 600; }
        .msg.ai .n .tag.deppco { background: rgba(192,132,252,0.12); color: var(--accent-purple); }
        .msg.ai .n .tag.fast { background: rgba(34,211,238,0.12); color: var(--accent-cyan); }
        .msg.ai .n .tag.natural { background: rgba(251,191,36,0.12); color: #fbbf24; }
        .msg.ai .n .tag.light { background: rgba(236,72,153,0.12); color: #ec4899; }
        .msg.ai .n .mood { font-size: 10px; padding: 2px 8px; border-radius: 12px; background: rgba(192,132,252,0.06); }
        .msg.sys { align-self: center; color: var(--text-secondary); font-size: 10px; background: var(--msg-sys-bg); padding: 4px 20px; border-radius: 16px; text-align: center; }
        .msg.mission { align-self: center; color: #fbbf24; font-size: 10px; background: rgba(251,191,36,0.04); padding: 4px 16px; border-radius: 12px; border: 1px solid rgba(251,191,36,0.04); }
        .msg.error { align-self: center; color: #f87171; font-size: 10px; background: rgba(239,68,68,0.04); padding: 4px 16px; border-radius: 12px; border: 1px solid rgba(239,68,68,0.04); }
        .bar { display: flex; gap: 6px; padding: 8px 12px; background: var(--bg-secondary); border-top: 1px solid var(--border-color); flex-shrink: 0; }
        .bar input { flex: 1; margin: 0; font-size: 13px; padding: 10px 16px; border-radius: 24px; }
        .bar button { padding: 10px 20px; border-radius: 24px; font-size: 13px; }
        
        .tts-btn {
            background: rgba(192,132,252,0.08); border: 1px solid rgba(192,132,252,0.1);
            border-radius: 20px; padding: 4px 12px; font-size: 10px; color: var(--accent-purple);
            cursor: pointer; transition: all 0.3s ease; display: inline-flex; align-items: center; gap: 4px;
        }
        .tts-btn:hover { background: rgba(192,132,252,0.15); }
        .tts-btn.playing { background: rgba(239,68,68,0.15); border-color: rgba(239,68,68,0.2); color: #f87171; }
        
        .adult-content { display: none; border-color: rgba(236,72,153,0.2) !important; }
        .adult-content.visible { display: block; }
        
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-modal); backdrop-filter: blur(10px);
            z-index: 1000; display: none; justify-content: center; align-items: center; padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: var(--bg-secondary); backdrop-filter: blur(20px);
            border: 1px solid var(--border-color); border-radius: 20px;
            padding: 24px; max-width: 480px; width: 100%; max-height: 90vh; overflow-y: auto;
        }
        .modal-content .close-btn { float: right; background: none; border: none; color: var(--text-secondary); font-size: 24px; cursor: pointer; }
        
        .fake-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(6px);
